name: Build Worktime for macOS
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: swift --version
      - name: Compile Worktime
        run: cd Worktime && swift build -c release --arch arm64
      - name: Create app bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/Worktime.app/Contents/MacOS
          cp Worktime/.build/arm64-apple-macosx/release/Worktime dist/Worktime.app/Contents/MacOS/Worktime
          chmod +x dist/Worktime.app/Contents/MacOS/Worktime
          cat > dist/Worktime.app/Contents/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleIdentifier</key><string>io.worktime.local</string>
          <key>CFBundleExecutable</key><string>Worktime</string>
          <key>CFBundleName</key><string>Worktime</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleShortVersionString</key><string>0.1</string>
          <key>CFBundleVersion</key><string>1</string>
          <key>LSUIElement</key><true/>
          <key>NSHighResolutionCapable</key><true/>
          <key>NSHumanReadableCopyright</key><string>Worktime</string>
          </dict></plist>
          PLIST
          plutil -lint dist/Worktime.app/Contents/Info.plist
          codesign --force --deep --sign - dist/Worktime.app
          cd dist && ditto -c -k --keepParent Worktime.app Worktime-macOS-arm64.zip
      - name: Upload macOS application
        uses: actions/upload-artifact@v4
        with:
          name: Worktime-macOS-arm64
          path: dist/Worktime-macOS-arm64.zip
          if-no-files-found: error
          retention-days: 14
